[package]
name = "densa-studio"
description = "Open Parquet, CSV and live data and explore it at once: grids, SQL and a docking workspace, built on densa"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://densa.dev"
repository = "https://github.com/densa-rs/densa-studio"
readme = "README.md"
# DataFusion 55's minimum.
rust-version = "1.94"
# An application, not a library: installed from this repository for now.
publish = false

[dependencies]
# Arrow 60, as densa uses.
arrow-array = "60"
arrow-cast = "60"
# Writing a query's result as CSV, and gathering its rows in the grid's order.
arrow-csv = { version = "60", default-features = false }
arrow-select = "60"
arrow-schema = "60"
parquet = { version = "60", default-features = false, features = ["arrow"] }
# densa from crates.io; its connectors from their main branch until they are released
# (Cargo.lock pins the commit).
densa-arrow = "0.2.1"
densa-chart = "0.2.1"
densa-data = "0.2.1"
densa-draw = "0.2.1"
densa-ui = "0.2.1"
densa-widgets = "0.2.1"
densa-window = "0.2.1"
densa-datafusion = { git = "https://github.com/densa-rs/densa-connectors" }
densa-files = { git = "https://github.com/densa-rs/densa-connectors" }
densa-flight = { git = "https://github.com/densa-rs/densa-connectors" }
densa-ws = { git = "https://github.com/densa-rs/densa-connectors" }
# The connectors' sample web requests, sensor stream and Flight service, for --sample.
samples = { git = "https://github.com/densa-rs/densa-connectors", features = ["flight"] }

[dev-dependencies]
# Text without the system's fonts, for tests of the panels.
densa-paragraph = { version = "0.2.1", default-features = false }
densa-text = "0.2.1"
# The grid's model, prepared as a paint does, for tests that choose rows.
densa-grid = "0.2.1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
debug = 1

# Files dropped on the window (densa_window::FileDrop) and category axes are newer than densa
# 0.2.1: until the next release, densa comes from its main branch (Cargo.lock pins the commit).
[patch.crates-io]
densa-arrow = { git = "https://github.com/densa-rs/densa" }
densa-chart = { git = "https://github.com/densa-rs/densa" }
densa-data = { git = "https://github.com/densa-rs/densa" }
densa-draw = { git = "https://github.com/densa-rs/densa" }
densa-grid = { git = "https://github.com/densa-rs/densa" }
densa-paragraph = { git = "https://github.com/densa-rs/densa" }
densa-text = { git = "https://github.com/densa-rs/densa" }
densa-ui = { git = "https://github.com/densa-rs/densa" }
densa-widgets = { git = "https://github.com/densa-rs/densa" }
densa-window = { git = "https://github.com/densa-rs/densa" }
